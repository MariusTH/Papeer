<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98a4b"/>
      <stop offset="1" stop-color="#8a5a2b"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf5e8"/>
      <stop offset="1" stop-color="#eee2c8"/>
    </linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b2a28"/>
      <stop offset="0.5" stop-color="#4a4740"/>
      <stop offset="1" stop-color="#2b2a28"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3b2208" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS-style rounded square -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- page that grows downward: sheet with a dashed seam and extension -->
  <g filter="url(#shadow)">
    <path d="M300 210 h330 l94 94 v510 a20 20 0 0 1 -20 20 H300 a20 20 0 0 1 -20 -20 V230 a20 20 0 0 1 20 -20z" fill="url(#paper)"/>
    <path d="M630 210 v74 a20 20 0 0 0 20 20 h74z" fill="#e3d3b2"/>
  </g>
  <line x1="300" y1="640" x2="704" y2="640" stroke="#c9b48c" stroke-width="6" stroke-dasharray="18 14"/>
  <!-- handwriting with pressure variation -->
  <path d="M338 420 c22 -40 40 -62 52 -40 c14 26 -26 70 -6 78 c22 8 40 -64 64 -60 c22 4 4 58 26 60 c26 2 34 -56 60 -54 c24 2 10 50 34 52 c20 2 36 -24 52 -40"
        fill="none" stroke="#2b2a28" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M338 520 c40 -10 90 -14 150 -8" fill="none" stroke="#2b2a28" stroke-width="10" stroke-linecap="round"/>
  <path d="M330 720 c30 -24 60 -30 100 -14" fill="none" stroke="#2b2a28" stroke-width="10" stroke-linecap="round"/>
  <!-- stylus -->
  <g transform="rotate(38 690 600)">
    <rect x="662" y="300" width="56" height="360" rx="28" fill="url(#pen)"/>
    <rect x="662" y="560" width="56" height="26" fill="#c98a4b"/>
    <path d="M662 650 L690 740 L718 650 z" fill="#2b2a28"/>
    <circle cx="690" cy="736" r="5" fill="#f2c27f"/>
  </g>
</svg>
